<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Claude Kitchen social card</title>
  <desc id="desc">Claude Kitchen exact logo on a warm orange brand background.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC7A47"/>
      <stop offset="100%" stop-color="#D65D31"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#FFF1E2" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#FFF1E2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#7D3019" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="630" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="52" y="52" width="1096" height="526" rx="34" fill="none" stroke="#FFF2E5" stroke-opacity="0.28"/>

  <image href="/logo/claude-kitchen-lockup-stacked.png" x="114" y="43" width="544" height="544" filter="url(#shadow)"/>

  <text x="716" y="208" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="8" fill="#FFF2E5" opacity="0.82">
    CLASSIC BIRYANI HUB
  </text>
  <text x="716" y="288" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="2" fill="#FFF9F2">
    Cook. Create.
  </text>
  <text x="716" y="358" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="700" letter-spacing="2" fill="#FFF9F2">
    Deliver.
  </text>
  <text x="716" y="438" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#FFF2E5" opacity="0.84">
    Slow-cooked dum biryani with a warm, unmistakable Claude Kitchen identity.
  </text>
</svg>
